name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o IQ_Floating_Signal_Source_Ready-1.zip -d extracted
          test -f extracted/iqoption_floating_signal_app/app/build.gradle
          test -f extracted/iqoption_floating_signal_app/settings.gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: extracted/iqoption_floating_signal_app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iq-floating-signal-debug-apk
          path: extracted/iqoption_floating_signal_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
